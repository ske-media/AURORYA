# Compile l'app iOS sur un Mac de GitHub et l'envoie sur TestFlight (ADR-024). Lancement manuel uniquement :
# onglet Actions → « iOS TestFlight » → Run workflow.
name: iOS TestFlight
on:
  workflow_dispatch:
concurrency:
  group: ios-testflight
  cancel-in-progress: false
jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      # Valeurs publiques, embarquées dans l'app : aucune n'est un secret.
      EXPO_PUBLIC_API_BASE_URL: https://aurorya.vercel.app
      EXPO_PUBLIC_SUPABASE_URL: https://glvtyivmnrniwguenwaf.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_xBUGPDaBCeq7CIGm7D6QaA_OVdwZX9v
      EXPO_PUBLIC_SITE_HOST: aurorya.vercel.app
      APP_ENV: production
      APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      # Le numéro de build doit croître à chaque envoi : le numéro d'exécution du workflow convient.
      IOS_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Secrets Apple présents
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          missing=""
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then echo "::error::Secrets manquants dans Settings → Secrets and variables → Actions :$missing"; exit 1; fi
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          grep -q "BEGIN PRIVATE KEY" "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" || { echo "::error::ASC_KEY_P8 doit contenir tout le fichier .p8, lignes BEGIN et END comprises."; exit 1; }
      - name: Xcode le plus récent
        run: |
          latest=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$latest"
          xcodebuild -version
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Projet natif iOS
        working-directory: apps/mobile
        run: |
          printf 'EXPO_PUBLIC_API_BASE_URL=%s\nEXPO_PUBLIC_SUPABASE_URL=%s\nEXPO_PUBLIC_SUPABASE_ANON_KEY=%s\nEXPO_PUBLIC_SITE_HOST=%s\n' \
            "$EXPO_PUBLIC_API_BASE_URL" "$EXPO_PUBLIC_SUPABASE_URL" "$EXPO_PUBLIC_SUPABASE_ANON_KEY" "$EXPO_PUBLIC_SITE_HOST" > .env
          npx expo prebuild --platform ios
      - name: Archive
        working-directory: apps/mobile/ios
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace Aurorya.xcworkspace -scheme Aurorya -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Aurorya.xcarchive" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            > "$RUNNER_TEMP/archive.log" 2>&1 || { tail -n 150 "$RUNNER_TEMP/archive.log"; exit 1; }
          tail -n 5 "$RUNNER_TEMP/archive.log"
      - name: Signature de distribution et envoi à TestFlight
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Aurorya.xcarchive" -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            > "$RUNNER_TEMP/export.log" 2>&1 || { tail -n 150 "$RUNNER_TEMP/export.log"; exit 1; }
          tail -n 15 "$RUNNER_TEMP/export.log"
      - name: Journaux de build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journaux-ios-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/export.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Effacer la clé
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
