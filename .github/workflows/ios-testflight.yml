# Compile l'app iOS sur un Mac de GitHub et l'envoie sur TestFlight (ADR-024). Lancement manuel uniquement :
# onglet Actions → « iOS TestFlight » → Run workflow.
name: iOS TestFlight
on:
  workflow_dispatch:
    inputs:
      distribution:
        description: "testflight : envoi à App Store Connect · adhoc : fichier .ipa pour les iPhone enregistrés"
        type: choice
        options: [testflight, adhoc]
        default: testflight
concurrency:
  group: ios-testflight
  cancel-in-progress: false
jobs:
  testflight:
    runs-on: macos-latest
    timeout-minutes: 90
    env:
      # Valeurs publiques, embarquées dans l'app : aucune n'est un secret.
      EXPO_PUBLIC_API_BASE_URL: https://aurorya.vercel.app
      EXPO_PUBLIC_SUPABASE_URL: https://glvtyivmnrniwguenwaf.supabase.co
      EXPO_PUBLIC_SUPABASE_ANON_KEY: sb_publishable_xBUGPDaBCeq7CIGm7D6QaA_OVdwZX9v
      EXPO_PUBLIC_SITE_HOST: aurorya.vercel.app
      # Clé publique RevenueCat (variable du dépôt). Vide tant que le compte n'existe pas : le paywall l'annonce.
      EXPO_PUBLIC_REVENUECAT_IOS_KEY: ${{ vars.EXPO_PUBLIC_REVENUECAT_IOS_KEY }}
      APP_ENV: production
      # Identifiants, pas des secrets : sans le fichier .p8 (secret ASC_KEY_P8), ils n'ouvrent rien.
      APPLE_TEAM_ID: C8T4LVB6QG
      ASC_KEY_ID: P383AJ28V7
      ASC_ISSUER_ID: 42463e88-3977-4b3d-9492-8765165d0f2f
      # Le numéro de build doit croître à chaque envoi : le numéro d'exécution du workflow convient.
      IOS_BUILD_NUMBER: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4
      - name: Clé Apple présente
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          if [ -z "$ASC_KEY_P8" ]; then echo "::error::Secret manquant dans Settings → Secrets and variables → Actions : ASC_KEY_P8"; exit 1; fi
          mkdir -p "$RUNNER_TEMP/asc"
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8"
          grep -q "BEGIN PRIVATE KEY" "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" || { echo "::error::ASC_KEY_P8 doit contenir tout le fichier .p8, lignes BEGIN et END comprises."; exit 1; }
      - name: Xcode le plus récent
        run: |
          latest=$(ls -d /Applications/Xcode_*.app | grep -v -i beta | sort -V | tail -1)
          sudo xcode-select -s "$latest"
          xcodebuild -version
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Projet natif iOS
        working-directory: apps/mobile
        run: |
          printf 'EXPO_PUBLIC_API_BASE_URL=%s\nEXPO_PUBLIC_SUPABASE_URL=%s\nEXPO_PUBLIC_SUPABASE_ANON_KEY=%s\nEXPO_PUBLIC_SITE_HOST=%s\nEXPO_PUBLIC_REVENUECAT_IOS_KEY=%s\n' \
            "$EXPO_PUBLIC_API_BASE_URL" "$EXPO_PUBLIC_SUPABASE_URL" "$EXPO_PUBLIC_SUPABASE_ANON_KEY" "$EXPO_PUBLIC_SITE_HOST" "$EXPO_PUBLIC_REVENUECAT_IOS_KEY" > .env
          npx expo prebuild --platform ios
      # Archive sans signature : signer ici exigerait un profil de développement, donc un appareil enregistré
      # sur le compte. La signature de distribution est posée à l'étape suivante.
      - name: Archive
        working-directory: apps/mobile/ios
        run: |
          set -o pipefail
          xcodebuild archive \
            -workspace Aurorya.xcworkspace -scheme Aurorya -configuration Release \
            -destination 'generic/platform=iOS' -archivePath "$RUNNER_TEMP/Aurorya.xcarchive" \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" \
            > "$RUNNER_TEMP/archive.log" 2>&1 || { tail -n 150 "$RUNNER_TEMP/archive.log"; exit 1; }
          tail -n 5 "$RUNNER_TEMP/archive.log"
      - name: Signature de distribution et envoi à TestFlight
        env:
          DISTRIBUTION: ${{ inputs.distribution || 'testflight' }}
        run: |
          if [ "$DISTRIBUTION" = "adhoc" ]; then METHOD=release-testing; DEST=export; else METHOD=app-store-connect; DEST=upload; fi
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>${METHOD}</string>
            <key>destination</key><string>${DEST}</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>${APPLE_TEAM_ID}</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Aurorya.xcarchive" -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/asc/AuthKey_${ASC_KEY_ID}.p8" \
            -authenticationKeyID "$ASC_KEY_ID" -authenticationKeyIssuerID "$ASC_ISSUER_ID" \
            > "$RUNNER_TEMP/export.log" 2>&1 || { tail -n 150 "$RUNNER_TEMP/export.log"; exit 1; }
          tail -n 15 "$RUNNER_TEMP/export.log"
      # Installation directe (ADR-027) : l'app signée pour les iPhone enregistrés sur le compte Apple.
      - name: Application pour installation directe
        if: inputs.distribution == 'adhoc'
        uses: actions/upload-artifact@v4
        with:
          name: aurorya-ios-${{ github.run_number }}
          path: ${{ runner.temp }}/export/*.ipa
          if-no-files-found: error
          retention-days: 14
      - name: Publication du lien d'installation
        if: inputs.distribution == 'adhoc'
        env:
          BLOB_READ_WRITE_TOKEN: ${{ secrets.BLOB_READ_WRITE_TOKEN }}
        run: |
          if [ -z "$BLOB_READ_WRITE_TOKEN" ]; then echo "::warning::Secret BLOB_READ_WRITE_TOKEN absent : lien d'installation non mis à jour."; exit 0; fi
          mkdir -p "$RUNNER_TEMP/blob" && cd "$RUNNER_TEMP/blob" && echo '{}' > package.json && npm i --silent @vercel/blob@2.9.0
          VERSION=$(node -p "require('$GITHUB_WORKSPACE/apps/mobile/package.json').version")
          cp "$GITHUB_WORKSPACE/scripts/ios/publish-adhoc.mjs" "$RUNNER_TEMP/blob/"
          node "$RUNNER_TEMP/blob/publish-adhoc.mjs" "$RUNNER_TEMP/export" "$VERSION" "$IOS_BUILD_NUMBER"
      - name: Journaux de build
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: journaux-ios-${{ github.run_number }}
          path: |
            ${{ runner.temp }}/archive.log
            ${{ runner.temp }}/export.log
          if-no-files-found: ignore
          retention-days: 7
      - name: Effacer la clé
        if: always()
        run: rm -rf "$RUNNER_TEMP/asc"
